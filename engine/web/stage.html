<!doctype html><html><body style="margin:0;background:#000;overflow:hidden">
<canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
<script type="module">
// Generic 3D "stage" intro: hero under a spotlight, opponents in the fog, 3D titles, team line-up, alarm.
// window.setup(schedule) once, then window.renderAt(t) per frame (t = global video time).
import * as THREE from 'three';
import {FontLoader} from 'three/addons/FontLoader.js';
import {TextGeometry} from 'three/addons/TextGeometry.js';
const RW = 810, RH = 1440;
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1); renderer.setSize(RW, RH, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.3;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, RW / RH, 0.5, 3000);
const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color: c, roughness: 0.8}, o));
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const eio = p => p * p * (3 - 2 * p), clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => b > a ? clamp((t - a) / (b - a)) : (t >= a ? 1 : 0);
const lerp = (a, b, p) => a + (b - a) * p;
const hex = c => (c[0] << 16) | (c[1] << 8) | c[2];
const font = await new Promise(r => new FontLoader().load('./vendor/helvetiker_bold.typeface.json', r));

function makeChar(color, longGun = false) {
  const g = new THREE.Group(); const body = new THREE.Group(); g.add(body);
  const mat = M(color, {roughness: 0.5, emissive: color, emissiveIntensity: 0.12});
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(2.2, 3.6, 4, 16), mat); torso.position.y = 6.2;
  const legM = M(0x22252d, {roughness: 0.7});
  const l1 = new THREE.Mesh(new THREE.CapsuleGeometry(0.9, 2.6, 3, 10), legM); l1.position.set(-1.0, 2.2, 0); const l2 = l1.clone(); l2.position.x = 1.0;
  const head = new THREE.Mesh(new THREE.SphereGeometry(1.8, 20, 14), M(0xe2c2a0, {roughness: 0.6})); head.position.y = 10.9;
  const cap = new THREE.Mesh(new THREE.SphereGeometry(1.95, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), mat); cap.position.y = 11.1;
  const gunM = M(0x15171c, {roughness: 0.4, metalness: 0.5});
  const gun = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, longGun ? 10 : 6.5), gunM); gun.position.set(1.4, 7.6, longGun ? 4.2 : 3.0);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.7, 1.0), new THREE.MeshStandardMaterial({color: 0x0b0d12, roughness: 0.2, metalness: 0.6, emissive: color, emissiveIntensity: 0.25})); visor.position.set(0, 11.0, 1.55);
  body.add(torso, l1, l2, head, cap, gun, visor);
  if (longGun) { const sc = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 3.2, 12), gunM); sc.rotation.x = Math.PI / 2; sc.position.set(1.4, 8.5, 3.6); body.add(sc); }
  body.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(g); return {g, body, mat};
}
function text3d(str, maxW, color, emissive = 0.8, size = 10) {
  const g = new TextGeometry(str, {font, size, depth: size * 0.25, curveSegments: 6, bevelEnabled: true, bevelThickness: size * 0.03, bevelSize: size * 0.02, bevelSegments: 2});
  g.computeBoundingBox(); const w = g.boundingBox.max.x - g.boundingBox.min.x; g.translate(-(g.boundingBox.max.x + g.boundingBox.min.x) / 2, 0, 0);
  const m = new THREE.Mesh(g, M(color, {emissive: color, emissiveIntensity: emissive, roughness: 0.35, metalness: 0.3}));
  const s = Math.min(1, maxW / w); m.scale.setScalar(s); m.castShadow = true; m.visible = false; scene.add(m); return m;
}

let S, YOU, spot, rimY, alarm, HUNT = [], beatObjs = [], dust;
window.setup = (sched) => {
  S = sched;
  const bg = S.mood === 'dark' ? 0x0d0609 : 0x070a12;
  scene.background = new THREE.Color(bg); scene.fog = new THREE.FogExp2(bg, 0.006);
  const gridTex = (() => { const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d');
    g.fillStyle = '#10141c'; g.fillRect(0, 0, 256, 256); g.strokeStyle = 'rgba(120,150,200,0.22)'; g.lineWidth = 2; g.strokeRect(0, 0, 256, 256);
    g.strokeStyle = 'rgba(120,150,200,0.08)'; g.lineWidth = 1; for (let i = 64; i < 256; i += 64) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke(); }
    const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(120, 120); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; })();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshStandardMaterial({map: gridTex, roughness: 0.35, metalness: 0.2}));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  scene.add(new THREE.HemisphereLight(0x6a7cb0, 0x0a0a0a, 0.7));
  const dg = new THREE.BufferGeometry(); const NP = 1600; const dp = new Float32Array(NP * 3);
  for (let i = 0; i < NP; i++) { dp[i * 3] = (Math.random() - 0.2) * 1400; dp[i * 3 + 1] = Math.random() * 60; dp[i * 3 + 2] = (Math.random() - 0.5) * 300; }
  dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
  dust = new THREE.Points(dg, new THREE.PointsMaterial({color: 0xaab8d8, size: 0.6, transparent: true, opacity: 0.55, depthWrite: false})); scene.add(dust);
  const HC = hex(S.hero_color), OC = hex(S.opp_color);
  YOU = makeChar(HC, S.hero_long_gun !== false);
  spot = new THREE.SpotLight(0xffd6a0, 5000, 220, Math.PI / 8, 0.45, 1.5); spot.position.set(0, 70, 12); spot.target = YOU.g; spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024); scene.add(spot);
  rimY = new THREE.SpotLight(0x6fa0ff, 900, 160, Math.PI / 7, 0.5, 1.5); rimY.position.set(0, 30, -50); rimY.target = YOU.g; scene.add(rimY);
  alarm = new THREE.PointLight(hex(S.alarm_color || [255, 32, 32]), 0, 160, 1.2); alarm.position.set(0, 30, -20); scene.add(alarm);
  const n = S.cold.enemies || 0;
  for (let i = 0; i < n; i++) {
    const x = n === 1 ? 18 : lerp(-24, 24, i / (n - 1)), z = -62 - 14 * Math.sin(Math.PI * (n === 1 ? 0.5 : i / (n - 1)));
    const c = makeChar(OC); c.g.position.set(x, 0, z); c.g.rotation.y = Math.atan2(-x, -z); c.z0 = z;
    const rim = new THREE.PointLight(OC, 0, 40, 1.5); rim.position.set(x, 14, z - 8); scene.add(rim); c.rim = rim; HUNT.push(c);
  }
  S.coldTitle = S.cold.title3d ? text3d(S.cold.title3d, 46, hex(S.cold.title_color || [255, 59, 59]), 0.9) : null;
  if (S.coldTitle) S.coldTitle.position.set(0, 26, -110);
  S.beats.forEach((b, i) => {
    const o = {b, x: 0};
    if (b.kind === 'score') { o.main = text3d(b.text3d, 50, hex(b.color), 0.7); o.main.position.set(0, 30, -125); if (b.sub3d) { o.sub = text3d(b.sub3d, 30, hex(b.sub_color || [255, 64, 64]), 0.8, 4); o.sub.position.set(0, 23, -125); } }
    else if (b.kind === 'lineup') {
      o.x = 300 * (i + 1); const nn = b.names.length; o.chars = b.names.map((nm, k) => { const c = makeChar(hex(b.color), !!(b.long_gun && b.long_gun.includes(nm))); c.g.position.set(o.x + (k - (nn - 1) / 2) * 9, 0, 0); return c; });
      o.light = new THREE.SpotLight(0x9cc4ff, 6000, 240, Math.PI / 6, 0.6, 1.5); o.light.position.set(o.x, 80, 40); o.light.target.position.set(o.x, 0, 0); o.light.castShadow = true; scene.add(o.light, o.light.target);
    }
    else if (b.kind === 'title') { o.x = 300 * (i + 1); o.main = text3d(b.text3d, 36, hex(b.color), 1.0); o.main.position.set(o.x, 14, 0); o.light = new THREE.PointLight(hex(b.color), 500, 160, 1.4); o.light.position.set(o.x, 30, 40); scene.add(o.light); }
    else if (b.kind === 'alarm') { o.main = text3d(b.text3d, 30, hex(b.color), 0.9); o.main.position.set(0, 19, -60); }
    beatObjs.push(o);
  });
  window.ready2 = true;
};

function walk(c, t, on) { c.body.position.y = on ? Math.abs(Math.sin(t * 10)) * 0.4 : 0; }
window.renderAt = (t) => {
  const C = S.cold, R = S.rise; const inCold = t < C.t1;
  let active = null; for (const o of beatObjs) if (t >= o.b.t0 && t < o.b.t1) active = o;
  if (!inCold && !active && t >= (S.beats.length ? S.beats[S.beats.length - 1].t0 : 0)) active = beatObjs[beatObjs.length - 1];
  const kind = inCold ? 'cold' : (active ? active.b.kind : 'cold');
  if (S.coldTitle) { S.coldTitle.visible = t < (C.punch_t0 || C.t1); S.coldTitle.rotation.y = Math.sin(t * 0.8) * 0.12; S.coldTitle.position.y = 26 + Math.sin(t * 1.3) * 0.8; }
  for (const o of beatObjs) { const on = o === active; if (o.main) { o.main.visible = on; o.main.rotation.y = Math.sin(t * 0.9) * 0.18; } if (o.sub) o.sub.visible = on; if (o.light) o.light.intensity = on ? (o.b.kind === 'lineup' ? 6000 : 500) : 0; }
  HUNT.forEach((c, i) => { const a = inCold ? eio(prog(t, C.t0 + 0.5 + i * 0.45, C.t0 + 0.9 + i * 0.45)) : (kind === 'alarm' ? 1 : 0);
    c.g.visible = a > 0.01; c.rim.intensity = 60 * a; c.g.position.z = c.z0 + (inCold ? 6 * prog(t, C.t0 + 0.5, C.t1) : 10); walk(c, t, inCold); });
  const heroStage = kind === 'cold' || kind === 'score' || kind === 'alarm';
  spot.intensity = heroStage ? 5000 : 0; rimY.intensity = heroStage ? 900 : 0;
  alarm.intensity = kind === 'alarm' ? 260 * (0.5 + 0.5 * Math.sin(t * 7)) : (inCold ? 40 * (0.5 + 0.5 * Math.sin(t * 5)) : 0);
  YOU.g.rotation.y = kind === 'alarm' ? Math.sin(t * 0.5) * 0.3 : 0; dust.rotation.y = t * 0.01;
  let pos, look, up = V(0, 1, 0);
  if (kind === 'cold') {
    const pt = C.punch_t0 || C.t1;
    if (t < pt) { const p = eio(prog(t, C.t0, pt)); pos = V(lerp(-6, 0, p), lerp(8, 11, p), lerp(66, 38, p)); look = V(0, lerp(16, 15, p), -40); }
    else { const p = eio(prog(t, pt, pt + 0.6)); pos = V(lerp(0, 7, p), lerp(11, 12, p), lerp(38, 27, p)); look = V(0, lerp(15, 9, p), lerp(-40, 0, p)); }
  } else if (t >= R.t0 && kind !== 'alarm') {
    const r = eio(prog(t, R.t0, R.t1)); spot.intensity = 5000;
    pos = V(0, lerp(40, 170, r), lerp(60, 0.01, r)); look = V(0, lerp(12, 0, r), lerp(-10, 0, r)); up = V(0, 1 - r, -r).normalize();
  } else {
    const b = active.b, p = eio(prog(t, b.t0, b.t1));
    if (kind === 'score') { const a = lerp(-0.35, 0.3, p); pos = V(Math.sin(a) * 50, 14, Math.cos(a) * 50); look = V(0, 20, -60); }
    else if (kind === 'lineup') { const nn = b.names.length, d0 = 40 + nn * 15; pos = V(active.x + lerp(-6, 6, p), lerp(13, 10, p), lerp(d0 + 20, d0, p)); look = V(active.x, 9, 0); }
    else if (kind === 'title') { pos = V(active.x + Math.sin(p * 0.6 - 0.3) * 14, lerp(12, 22, p), lerp(130, 95, p)); look = V(active.x, 18, 0); }
    else { const q = eio(prog(t, b.t0, Math.min(b.t0 + 1.3, R.t0))); const r = eio(prog(t, R.t0, R.t1));
      pos = V(0, lerp(lerp(30, 34, q), 170, r), lerp(lerp(70, 58, q), 0.01, r)); look = V(0, lerp(14, 0, r), lerp(-20, 0, r)); up = V(0, 1 - r, -r).normalize(); }
  }
  camera.up.copy(up); camera.position.copy(pos); camera.lookAt(look); renderer.render(scene, camera);
  const proj = (x, y, z) => { const v = V(x, y, z).project(camera); return [(v.x + 1) / 2 * 1080, (1 - v.y) / 2 * 1920, v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05]; };
  const out = {kind, you: proj(0, 15, 0), hunt: HUNT.map(c => proj(c.g.position.x, 15, c.g.position.z)), line: []};
  if (active && active.chars) out.line = active.chars.map(c => proj(c.g.position.x, 15.5, 0));
  return out;
};
window.ready = true;
</script></body></html>
